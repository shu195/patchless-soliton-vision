[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchless-soliton-vision"
version = "1.0.0"
description = "Continuous Receptive Field Solitons on C-Infinity Manifolds Without Grid Tokenization"
readme = "README.md"
authors = [
  { name = "Shubham Barmase", email = "barmase32@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "matplotlib>=3.6.0",
    "Pillow>=9.0.0"
]

[project.urls]
Homepage = "https://github.com/shu195/patchless-soliton-vision"
Repository = "https://github.com/shu195/patchless-soliton-vision"
Profile = "https://github.com/shu195"
